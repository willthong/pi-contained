services:
  pi:
    build: .
    # No ports are published: Paseo reaches the apps through its outbound-only
    # relay, and the daemon itself binds loopback inside the container.
    stop_grace_period: 20s
    environment:
      - GH_TOKEN=${GH_TOKEN:-}
      - GITHUB_PAT=${GITHUB_PAT:-}
      # Commit identity for the container's global git config. Empty
      # leaves git's default (root@<container-host>) in place.
      - GIT_USER_NAME=${GIT_USER_NAME:-}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-}
      # Set to 1 to run the container without the Paseo daemon.
      - PASEO_DISABLED=${PASEO_DISABLED:-0}
      # Required only if PASEO_LISTEN is changed to something other than
      # loopback; entrypoint.sh refuses to start without it in that case.
      - PASEO_PASSWORD=${PASEO_PASSWORD:-}
      # Local speech/dictation downloads large models on first run. Off by
      # default here; set to true to enable Paseo voice features.
      - PASEO_DICTATION_ENABLED=${PASEO_DICTATION_ENABLED:-false}
      - PASEO_VOICE_MODE_ENABLED=${PASEO_VOICE_MODE_ENABLED:-false}
    volumes:
      - ./pi-config:/root/.pi
      # Paseo state (daemon identity/keypair, config, agents). Keeps pairing
      # valid across restarts and recreation.
      - ./paseo-config:/root/.paseo
      - ./projects:/root/projects
